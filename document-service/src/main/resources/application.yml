spring:
  application:
    name: document-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:docsearch}
    username: ${DB_USER:docsearch}
    password: ${DB_PASSWORD:docsearch}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      connect-timeout: 2000ms

  # Producer only - document-service publishes DocumentEvents to Kafka via the
  # outbox relay but never consumes them; document-indexer owns the
  # consumer/listener side of this topic (see its own application.yml).
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 5
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        linger.ms: 5
        # Default is 60000ms - confirmed live (docs/SUBMISSION.md §2
        # Resilience) that with the default, a Kafka outage stalled the
        # single-threaded, fixedDelay-scheduled OutboxRelay for a full 60s
        # per failed attempt (it blocks waiting for topic metadata before
        # failing), so recovery after a transient outage was far slower than
        # the 200ms poll interval would suggest. Lower bound: fail fast, let
        # the next scheduled attempt retry sooner. No data loss either way -
        # the failure aborts relay()'s transaction, so the outbox row survives
        # to be retried - this only affects how quickly the pipeline notices
        # the outage has cleared.
        max.block.ms: 5000

app:
  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
    index-name: ${ES_INDEX:documents}
    connect-timeout-ms: 2000
    socket-timeout-ms: 5000
  kafka:
    document-events-topic: ${KAFKA_DOCUMENT_TOPIC:document-index-events}
  cache:
    search-results-ttl-seconds: ${SEARCH_CACHE_TTL:30}
    document-ttl-seconds: ${DOCUMENT_CACHE_TTL:120}
  rate-limit:
    default-requests-per-minute: ${RATE_LIMIT_RPM:120}
    search-requests-per-minute: ${SEARCH_RATE_LIMIT_RPM:300}
    # Confirmed by review: /auth/login had no rate limit at all (it can't use
    # the normal per-tenant RateLimitInterceptor - tenant isn't known until
    # after login succeeds), leaving credential stuffing/brute force wide
    # open. Keyed by client IP instead - see AuthController.
    login-requests-per-minute: ${LOGIN_RATE_LIMIT_RPM:10}
  jwt:
    # HS256 requires >= 32 bytes - the default below is 63 bytes, fine for
    # local dev; production must inject a real secret (or, better, move to
    # JWKS-verified tokens from an external IdP - see docs/SUBMISSION.md).
    secret: ${JWT_SECRET:local-dev-only-secret-key-not-for-production-use-32bytes+}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # The assignment explicitly requires a health endpoint that shows
      # per-dependency status. "when-authorized" would silently hide that
      # from everyone, since this prototype has no Spring Security to ever
      # satisfy "authorized" - actuator already lives on its own port
      # (management.server.port, above), separate from the public API, which
      # is the actual mitigation for exposing this to the same audience as
      # the REST endpoints; in production that port would be firewalled to
      # internal/ops traffic only, not further gated at the app layer.
      show-details: always
      probes:
        enabled: true
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true

logging:
  level:
    root: INFO
    com.docsearch: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [tenant=%X{tenantId}] %logger{36} - %msg%n"
